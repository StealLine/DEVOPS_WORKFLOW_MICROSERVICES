apiVersion: 1
datasources:
  - name: grafana-voki-prom
    uid: voki-prom 
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true        
    jsonData:
      timeInterval: "30s" 

  - name: grafana-voki-logs
    uid: voki-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
