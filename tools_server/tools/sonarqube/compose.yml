services:
  sonarqube:
    depends_on:
      db:
        condition: service_healthy

    image: mc1arke/sonarqube-with-community-branch-plugin:26.3.0.120487-community
    container_name: sonarqube
    networks:
      - sonarnet
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`sonarqube.yourdomain`)"
      - "traefik.http.services.dockhand.loadbalancer.server.port=9000"
      - "traefik.http.routers.dockhand.tls.certresolver=le"
      - "traefik.http.routers.dockhand.tls=true"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.docker.network=sonarnet"


  db:
    image: postgres:16
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonar" ]
      interval: 10s
      timeout: 5s
      retries: 5
    hostname: db
    container_name: postgres
    networks:
      - sonarnet
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - postgresql:/var/lib/postgresql

volumes:
  sonarqube_conf:
  sonarqube_data:
   external: true
  postgresql:
   external: true
networks:
  sonarnet:
    external: true
