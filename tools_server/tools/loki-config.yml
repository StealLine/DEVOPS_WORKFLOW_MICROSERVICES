# =============================================================================
# Loki Configuration — Single-node, filesystem storage
# auth_enabled: false — no multi-tenant auth, all logs go to the "fake" tenant
# =============================================================================

auth_enabled: false

# -----------------------------------------------------------------------------
# Server — HTTP API endpoint
# -----------------------------------------------------------------------------
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

# -----------------------------------------------------------------------------
# Common — shared defaults for all components
# replication_factor: 1 — single node, no replication needed
# ring kvstore: inmemory — no external coordination (etcd/consul) required
# -----------------------------------------------------------------------------
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# -----------------------------------------------------------------------------
# Schema — defines how logs are indexed and stored over time
# from: 2024-01-01 — this schema applies to all data from this date onward
# store: tsdb       — TSDB index format (recommended for Loki 2.8+)
# object_store: filesystem — store chunks locally (not S3/GCS)
# schema: v13       — latest schema version, required for structured metadata
# index.period: 24h — one index file per day
# -----------------------------------------------------------------------------
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# -----------------------------------------------------------------------------
# Storage — filesystem paths for chunks (raw log data)
# Mapped to /loki/chunks inside the container via Docker volume
# -----------------------------------------------------------------------------
storage_config:
  filesystem:
    directory: /loki/chunks

# -----------------------------------------------------------------------------
# Limits — per-tenant ingestion and query guardrails
# reject_old_samples: true          — drop logs older than max_age
# reject_old_samples_max_age: 168h  — max log age = 7 days
# ingestion_rate_mb: 10             — sustained ingestion limit per tenant (MB/s)
# ingestion_burst_size_mb: 20       — burst ingestion limit per tenant (MB)
# allow_structured_metadata: true   — enables key=value metadata on log lines (Loki 3.x)
# volume_enabled: true              — enables log volume endpoint for Grafana Explore
# -----------------------------------------------------------------------------
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

# -----------------------------------------------------------------------------
# Compactor — merges index files and enforces retention
# retention_enabled: true           — actively deletes chunks older than retention period
# delete_request_store: filesystem  — tracks pending deletes on local disk
# working_directory: /loki/compactor — scratch space for compaction work
# -----------------------------------------------------------------------------
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
