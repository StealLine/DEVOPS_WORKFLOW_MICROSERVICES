# =============================================================================
# Monitoring
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Alloy — Grafana's OpenTelemetry-native collector (replaces Grafana Agent)
  # Collects host metrics, logs, and container telemetry, then forwards to
  # Prometheus (remote-write) and Loki (push).
  #
  # Requires privileged mode + extensive host mounts to access:
  #   /proc, /sys, /        — host OS metrics (CPU, memory, disk, fs)
  #   /dev/disk             — disk I/O stats
  #   /var/lib/docker       — Docker internals
  #   /var/log/journal      — systemd journal logs
  #   /run/dbus/...         — D-Bus socket for systemd unit metrics
  #   /var/run/docker.sock  — Docker API (container discovery & log collection)
  #   /run/containerd/...   — containerd socket (read-only, container runtime)
  #   /dev/kmsg             — kernel message buffer
  #
  # Config is mounted from ./config.alloy.
  # host.docker.internal resolves to the host machine IP inside the container.
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.14.0
    privileged: true
    environment:
      ALLOY_DEPLOY_MODE: docker
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /proc:/rootproc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /dev/disk/:/dev/disk:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/log/journal:/var/log/journal:ro
      - alloy_data:/var/lib/alloy
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Allows Alloy to reach host services by hostname
    devices:
      - /dev/kmsg
    networks:
      - monitor-net

# =============================================================================
# Volumes — all external (created outside this stack, persist independently)
# =============================================================================
volumes:
  alloy_data:
    external: true

# =============================================================================
# Networks — external bridge network shared across stacks
# =============================================================================
networks:
  monitor-net:
    external: true
    driver: bridge
